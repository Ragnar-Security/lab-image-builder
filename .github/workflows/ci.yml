name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # What the tests run for real (measured with a logging shim on every
      # PATH entry): bash and sh, coreutils, findutils, grep, sed, tar, gzip
      # and git. ssh, scp, ssh-keygen and the cloud CLIs are faked. The AWS
      # tests marked real_cli use the runner's own AWS CLI and skip without it.
      - name: Install OS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash coreutils findutils git grep gzip sed tar

      # Same pin as the dev group in pyproject.toml.
      - name: Install pytest
        run: pip install pytest==9.0.3

      - name: Run tests
        run: python -m pytest -q --tb=short
